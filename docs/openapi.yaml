openapi: 3.0.3
info:
  title: Fiber Banking API
  version: 1.0.0
  description: |
    Dokumentasi OpenAPI untuk API perbankan sederhana berbasis Go Fiber.

    Semua pesan response menggunakan bahasa Indonesia dan format standar:
    - Sukses: `{ data: T, status: true, message: string }`
    - Error: `{ status: false, message: string }`
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Settings
  - name: Customer
  - name: Staff
  - name: Admin

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Cek status API (public)
      description: |
        Endpoint publik untuk memastikan API berjalan.

        role = `public`
      security: []
      responses:
        "200":
          description: API berjalan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      app: Fiber Banking API
                    status: true
                    message: API berjalan
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register customer (customer)
      description: |
        Endpoint publik untuk mendaftarkan user baru dengan role otomatis `customer`.

        role = `customer`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              default:
                value:
                  name: Customer Baru
                  email: customerbaru@example.com
                  password: password123
      responses:
        "201":
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      id: c3m2y8p9x0n4q7r1s6t5u8v2
                      name: Customer Baru
                      email: customerbaru@example.com
                      role: customer
                      account_number: "20260723153001u8v2"
                    status: true
                    message: Registrasi berhasil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login (admin, staff, customer)
      description: |
        Login user admin, staff, atau customer menggunakan email dan password.

        role = `admin`, `staff`, `customer`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  email: customer@example.com
                  password: password123
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                      user:
                        id: ccustomer00000000000000001
                        name: Customer Satu
                        email: customer@example.com
                        role: customer
                    status: true
                    message: Login berhasil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Kirim OTP reset password (admin, staff, customer)
      description: |
        Mengirim OTP ke email via Resend. Jika `RESEND_API_KEY` kosong, OTP dicetak ke stdout untuk development.

        role = `admin`, `staff`, `customer`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            examples:
              default:
                value:
                  email: customer@example.com
      responses:
        "200":
          description: OTP berhasil dikirim atau email tidak diungkap keberadaannya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      otp_id: cotp000000000000000000001
                    status: true
                    message: OTP berhasil dikirim ke email
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verifikasi OTP reset password (admin, staff, customer)
      description: |
        Memverifikasi OTP reset password dan mengembalikan token reset password sementara.

        role = `admin`, `staff`, `customer`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
            examples:
              default:
                value:
                  email: customer@example.com
                  otp: "123456"
      responses:
        "200":
          description: OTP valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyOtpSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      email: customer@example.com
                      reset_token: reset-token-example
                    status: true
                    message: OTP valid
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Ubah password dengan token reset (admin, staff, customer)
      description: |
        Mengubah password baru setelah OTP terverifikasi. Token reset dikirim dari response verify OTP.

        role = `admin`, `staff`, `customer`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            examples:
              default:
                value:
                  email: customer@example.com
                  reset_token: reset-token-example
                  password: passwordbaru123
                  verify_password: passwordbaru123
      responses:
        "200":
          description: Password berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              examples:
                success:
                  value:
                    status: true
                    message: Password berhasil diperbarui
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout user login (admin, staff, customer)
      description: |
        Mengakhiri sesi di sisi client. Token bearer tetap wajib dikirim agar server dapat memvalidasi sesi aktif.

        role = `admin`, `staff`, `customer`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              examples:
                success:
                  value:
                    data: null
                    status: true
                    message: Logout berhasil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/me:
    get:
      tags: [Settings]
      summary: Info user login (admin, staff, customer)
      description: |
        Mengambil informasi user yang sedang login. Jika role customer, response menyertakan info rekening.

        role = `admin`, `staff`, `customer`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Data pengguna berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      id: ccustomer00000000000000001
                      name: Customer Satu
                      email: customer@example.com
                      role: customer
                      account:
                        account_number: "1000000001"
                        balance: 98750000
                    status: true
                    message: Data pengguna berhasil diambil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/check-auth:
    get:
      tags: [Settings]
      summary: Cek session valid (admin, staff, customer)
      description: |
        Mengecek apakah bearer token/session saat ini valid.

        role = `admin`, `staff`, `customer`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Session valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckAuthSuccessResponse"
              examples:
                success:
                  value:
                    data: admin
                    message: Session valid
                    status: true
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/settings/profile:
    put:
      tags: [Settings]
      summary: Update profil user login (admin, staff, customer)
      description: |
        Mengubah nama dan email user yang sedang login.

        role = `admin`, `staff`, `customer`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            examples:
              default:
                value:
                  name: Customer Satu Update
                  email: customer.update@example.com
      responses:
        "200":
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      id: ccustomer00000000000000001
                      name: Customer Satu Update
                      email: customer.update@example.com
                      role: customer
                    status: true
                    message: Profil berhasil diperbarui
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/settings/password:
    put:
      tags: [Settings]
      summary: Update password user login (admin, staff, customer)
      description: |
        Mengubah password user yang sedang login dengan validasi password lama.

        role = `admin`, `staff`, `customer`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
            examples:
              default:
                value:
                  old_password: password123
                  new_password: passwordbaru123
                  verify_password: passwordbaru123
      responses:
        "200":
          description: Password berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              examples:
                success:
                  value:
                    status: true
                    message: Password berhasil diperbarui
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/customer/mutations:
    get:
      tags: [Customer]
      summary: List mutasi customer login (customer)
      description: |
        Mengambil daftar mutasi milik customer yang sedang login.

        role = `customer`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
        - $ref: "#/components/parameters/TransactionTypeQuery"
        - $ref: "#/components/parameters/TransactionDirectionQuery"
        - $ref: "#/components/parameters/ActorRoleQuery"
        - $ref: "#/components/parameters/DateFromQuery"
        - $ref: "#/components/parameters/DateToQuery"
      responses:
        "200":
          description: Mutasi berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationListSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      items:
                        - id: ctx000000000000000000001
                          type: transfer
                          direction: out
                          amount: 1250000
                          balance_before: 100000000
                          balance_after: 98750000
                          reference_id: cref000000000000000000001
                          note: Transfer awal antar customer
                          actor_name: Customer Satu
                          actor_role: customer
                          created_at: "2026-07-23 15:30:00"
                      pagination:
                        current_page: 1
                        per_page: 10
                        from: 1
                        total: 1
                        last_page: 1
                    status: true
                    message: Mutasi berhasil diambil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/customer/mutations/{id}:
    get:
      tags: [Customer]
      summary: Detail mutasi customer login (customer)
      description: Mengambil detail satu mutasi milik customer yang sedang login.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/MutationIdPath"
      responses:
        "200":
          $ref: "#/components/responses/MutationSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/customer/deposit:
    post:
      tags: [Customer]
      summary: Setor tunai customer login (customer)
      description: |
        Customer melakukan setor tunai ke rekening sendiri.

        role = `customer`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
            examples:
              default:
                value:
                  amount: "100000.00"
                  note: Setor tunai mandiri
      responses:
        "201":
          description: Setor tunai berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      amount: 10000000
                      balance: 110000000
                    status: true
                    message: Setor tunai berhasil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/customer/withdraw:
    post:
      tags: [Customer]
      summary: Tarik tunai customer login (customer)
      description: |
        Customer melakukan tarik tunai dari rekening sendiri.

        role = `customer`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
            examples:
              default:
                value:
                  amount: "50000.00"
                  note: Tarik tunai mandiri
      responses:
        "201":
          description: Tarik tunai berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      amount: 5000000
                      balance: 105000000
                    status: true
                    message: Tarik tunai berhasil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/customer/transfer:
    post:
      tags: [Customer]
      summary: Transfer customer login (customer)
      description: |
        Customer melakukan transfer dari rekening sendiri ke customer lain.

        role = `customer`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerTransferRequest"
            examples:
              default:
                value:
                  to_customer_id: ccustomer00000000000000002
                  amount: "12500.00"
                  note: Transfer belanja
      responses:
        "201":
          description: Transfer berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      reference_id: cref000000000000000000001
                      amount: 1250000
                      balance: 98750000
                    status: true
                    message: Transfer berhasil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/staff/dashboard:
    get:
      tags: [Staff]
      summary: Ringkasan dashboard staff (admin, staff)
      description: Mengambil ringkasan customer, saldo, total income/outcome 30 hari, dan data chart harian.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          $ref: "#/components/responses/DashboardSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/staff/customers:
    get:
      tags: [Staff]
      summary: List customers (admin, staff)
      description: |
        Mengambil daftar customer beserta rekening dan saldo. Bisa diakses role `staff` atau `admin`.

        role = `admin`, `staff`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
        - $ref: "#/components/parameters/CustomerStatusQuery"
      responses:
        "200":
          $ref: "#/components/responses/CustomerListSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Staff]
      summary: Buat customer (admin, staff)
      description: Staff atau admin membuat customer beserta rekening awal bersaldo 0.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        $ref: "#/components/requestBodies/CustomerBody"
      responses:
        "201":
          $ref: "#/components/responses/CustomerSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/staff/customers/options:
    get:
      tags: [Staff]
      summary: Opsi customer untuk select (admin, staff)
      description: Mengambil semua customer aktif tanpa pagination, search, atau limit untuk kebutuhan select transaksi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Opsi customer berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOptionListSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      - id: ccustomer00000000000000001
                        name: Customer Satu
                        email: customer@example.com
                        account_number: "1000000001"
                    status: true
                    message: Opsi customer berhasil diambil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/staff/customers/{customer_id}:
    get:
      tags: [Staff]
      summary: Detail customer (admin, staff)
      description: Mengambil detail core customer, rekening, status, dan mutasi terbaru.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      responses:
        "200":
          $ref: "#/components/responses/CustomerDetailSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags: [Staff]
      summary: Update customer (admin, staff)
      description: Memperbarui profil, status, dan opsional password customer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      requestBody:
        $ref: "#/components/requestBodies/CustomerBody"
      responses:
        "200":
          $ref: "#/components/responses/CustomerSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Staff]
      summary: Hapus customer (admin, staff)
      description: Soft delete customer dan menandai status menjadi inactive.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      responses:
        "200":
          $ref: "#/components/responses/EmptySuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/staff/mutations:
    get:
      tags: [Staff]
      summary: List semua mutasi customer (admin, staff)
      description: |
        Mengambil mutasi semua customer dan menyertakan aktor yang melakukan transaksi.

        role = `admin`, `staff`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
        - $ref: "#/components/parameters/TransactionTypeQuery"
        - $ref: "#/components/parameters/TransactionDirectionQuery"
        - $ref: "#/components/parameters/CustomerIdQuery"
        - $ref: "#/components/parameters/ActorRoleQuery"
        - $ref: "#/components/parameters/DateFromQuery"
        - $ref: "#/components/parameters/DateToQuery"
      responses:
        "200":
          $ref: "#/components/responses/AllMutationListSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/staff/mutations/{id}:
    get:
      tags: [Staff]
      summary: Detail mutasi (admin, staff)
      description: Mengambil detail satu mutasi berdasarkan ID transaksi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/MutationIdPath"
      responses:
        "200":
          $ref: "#/components/responses/AllMutationSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/staff/customers/{customer_id}/deposit:
    post:
      tags: [Staff]
      summary: Setor tunai untuk customer (admin, staff)
      description: |
        Staff atau admin melakukan setor tunai dengan memilih customer.

        role = `admin`, `staff`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      requestBody:
        $ref: "#/components/requestBodies/AmountBody"
      responses:
        "201":
          $ref: "#/components/responses/StaffDepositSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/staff/customers/{customer_id}/withdraw:
    post:
      tags: [Staff]
      summary: Tarik tunai untuk customer (admin, staff)
      description: |
        Staff atau admin melakukan tarik tunai dengan memilih customer.

        role = `admin`, `staff`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      requestBody:
        $ref: "#/components/requestBodies/AmountBody"
      responses:
        "201":
          $ref: "#/components/responses/StaffWithdrawSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/staff/customers/{customer_id}/transfer:
    post:
      tags: [Staff]
      summary: Transfer untuk customer (admin, staff)
      description: |
        Staff atau admin melakukan transfer dari customer pilihan ke customer tujuan.

        role = `admin`, `staff`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      requestBody:
        $ref: "#/components/requestBodies/CustomerTransferBody"
      responses:
        "201":
          $ref: "#/components/responses/StaffTransferSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/dashboard:
    get:
      tags: [Admin]
      summary: Ringkasan dashboard admin (admin)
      description: Alias dashboard teller pada prefix admin.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          $ref: "#/components/responses/DashboardSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/customers:
    get:
      tags: [Admin]
      summary: List customers untuk admin (admin)
      description: |
        Alias fitur teller pada prefix admin. Mengambil daftar customer beserta rekening dan saldo.

        role = `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
        - $ref: "#/components/parameters/CustomerStatusQuery"
      responses:
        "200":
          $ref: "#/components/responses/CustomerListSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Admin]
      summary: Buat customer (admin)
      description: Admin membuat customer beserta rekening awal bersaldo 0.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        $ref: "#/components/requestBodies/CustomerBody"
      responses:
        "201":
          $ref: "#/components/responses/CustomerSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/customers/options:
    get:
      tags: [Admin]
      summary: Opsi customer untuk select (admin)
      description: Mengambil semua customer aktif tanpa pagination, search, atau limit untuk kebutuhan select transaksi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Opsi customer berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOptionListSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      - id: ccustomer00000000000000001
                        name: Customer Satu
                        email: customer@example.com
                        account_number: "1000000001"
                    status: true
                    message: Opsi customer berhasil diambil
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/customers/{customer_id}:
    get:
      tags: [Admin]
      summary: Detail customer (admin)
      description: Admin mengambil detail core customer, rekening, status, dan mutasi terbaru.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      responses:
        "200":
          $ref: "#/components/responses/CustomerDetailSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags: [Admin]
      summary: Update customer (admin)
      description: Admin memperbarui profil, status, dan opsional password customer.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      requestBody:
        $ref: "#/components/requestBodies/CustomerBody"
      responses:
        "200":
          $ref: "#/components/responses/CustomerSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Admin]
      summary: Hapus customer (admin)
      description: Admin melakukan soft delete customer dan menandai status inactive.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      responses:
        "200":
          $ref: "#/components/responses/EmptySuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/mutations:
    get:
      tags: [Admin]
      summary: List semua mutasi customer untuk admin (admin)
      description: |
        Alias fitur teller pada prefix admin. Mengambil mutasi semua customer dan menyertakan aktor transaksi.

        role = `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
        - $ref: "#/components/parameters/TransactionTypeQuery"
        - $ref: "#/components/parameters/TransactionDirectionQuery"
        - $ref: "#/components/parameters/CustomerIdQuery"
        - $ref: "#/components/parameters/ActorRoleQuery"
        - $ref: "#/components/parameters/DateFromQuery"
        - $ref: "#/components/parameters/DateToQuery"
      responses:
        "200":
          $ref: "#/components/responses/AllMutationListSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/mutations/{id}:
    get:
      tags: [Admin]
      summary: Detail mutasi (admin)
      description: Admin mengambil detail satu mutasi berdasarkan ID transaksi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/MutationIdPath"
      responses:
        "200":
          $ref: "#/components/responses/AllMutationSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/customers/{customer_id}/deposit:
    post:
      tags: [Admin]
      summary: Admin setor tunai untuk customer (admin)
      description: |
        Alias fitur teller pada prefix admin. Admin melakukan setor tunai dengan memilih customer.

        role = `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      requestBody:
        $ref: "#/components/requestBodies/AmountBody"
      responses:
        "201":
          $ref: "#/components/responses/StaffDepositSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/customers/{customer_id}/withdraw:
    post:
      tags: [Admin]
      summary: Admin tarik tunai untuk customer (admin)
      description: |
        Alias fitur teller pada prefix admin. Admin melakukan tarik tunai dengan memilih customer.

        role = `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      requestBody:
        $ref: "#/components/requestBodies/AmountBody"
      responses:
        "201":
          $ref: "#/components/responses/StaffWithdrawSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/customers/{customer_id}/transfer:
    post:
      tags: [Admin]
      summary: Admin transfer untuk customer (admin)
      description: |
        Alias fitur teller pada prefix admin. Admin melakukan transfer dari customer pilihan ke customer tujuan.

        role = `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdPath"
      requestBody:
        $ref: "#/components/requestBodies/CustomerTransferBody"
      responses:
        "201":
          $ref: "#/components/responses/StaffTransferSuccessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/staff:
    get:
      tags: [Admin]
      summary: List staff (admin)
      description: |
        Admin mengambil daftar staff.

        role = `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: Staff berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffListSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      items:
                        - id: cstaff000000000000000001
                          name: Staff Teller
                          email: staff@example.com
                          role: staff
                          created_at: "2026-07-23 15:30:00"
                      pagination:
                        current_page: 1
                        per_page: 10
                        from: 1
                        total: 1
                        last_page: 1
                    status: true
                    message: Staff berhasil diambil
        default:
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Admin]
      summary: Buat staff (admin)
      description: |
        Admin membuat user staff baru.

        role = `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreateRequest"
            examples:
              default:
                value:
                  name: Staff Baru
                  email: staffbaru@example.com
                  password: password123
      responses:
        "201":
          description: Staff berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      id: cstaffbaru00000000000001
                      name: Staff Baru
                      email: staffbaru@example.com
                      role: staff
                    status: true
                    message: Staff berhasil dibuat
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/admin/staff/{id}:
    put:
      tags: [Admin]
      summary: Update staff (admin)
      description: |
        Admin memperbarui data staff. Field `password` opsional; jika kosong password tidak diubah.

        role = `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/StaffIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdateRequest"
            examples:
              default:
                value:
                  name: Staff Teller Update
                  email: staff.update@example.com
                  password: passwordbaru123
      responses:
        "200":
          description: Staff berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSuccessResponse"
              examples:
                success:
                  value:
                    data:
                      id: cstaff000000000000000001
                      name: Staff Teller Update
                      email: staff.update@example.com
                      role: staff
                    status: true
                    message: Staff berhasil diperbarui
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Admin]
      summary: Hapus staff (admin)
      description: |
        Admin menghapus staff secara soft delete.

        role = `admin`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/StaffIdPath"
      responses:
        "200":
          description: Staff berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptySuccessResponse"
              examples:
                success:
                  value:
                    status: true
                    message: Staff berhasil dihapus
        default:
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Gunakan header `Authorization: Bearer <access_token>`."

  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: Token bearer hasil login.
      schema:
        type: string
        example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
    SearchQuery:
      name: q
      in: query
      required: false
      description: Kata kunci pencarian list.
      schema:
        type: string
        example: customer
    PageQuery:
      name: page
      in: query
      required: false
      description: Nomor halaman. Default `1`.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    PerPageQuery:
      name: per_page
      in: query
      required: false
      description: Jumlah data per halaman. Default `10`, maksimal `100`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    CustomerIdPath:
      name: customer_id
      in: path
      required: true
      description: ID user customer tujuan operasi.
      schema:
        type: string
        example: ccustomer00000000000000001
    StaffIdPath:
      name: id
      in: path
      required: true
      description: ID user staff.
      schema:
        type: string
        example: cstaff000000000000000001
    MutationIdPath:
      name: id
      in: path
      required: true
      description: ID mutasi/transaksi.
      schema:
        type: string
        example: ctx000000000000000000001
    CustomerStatusQuery:
      name: status
      in: query
      required: false
      description: Filter status customer.
      schema:
        $ref: "#/components/schemas/CustomerStatus"
    TransactionTypeQuery:
      name: type
      in: query
      required: false
      description: Filter jenis transaksi.
      schema:
        $ref: "#/components/schemas/TransactionType"
    TransactionDirectionQuery:
      name: direction
      in: query
      required: false
      description: Filter arah transaksi.
      schema:
        $ref: "#/components/schemas/TransactionDirection"
    CustomerIdQuery:
      name: customer_id
      in: query
      required: false
      description: Filter mutasi berdasarkan customer.
      schema:
        type: string
        example: ccustomer00000000000000001
    ActorRoleQuery:
      name: actor_role
      in: query
      required: false
      description: Filter role aktor transaksi.
      schema:
        $ref: "#/components/schemas/Role"
    DateFromQuery:
      name: date_from
      in: query
      required: false
      description: Tanggal awal filter mutasi (inklusif).
      schema:
        type: string
        format: date
        example: "2026-07-01"
    DateToQuery:
      name: date_to
      in: query
      required: false
      description: Tanggal akhir filter mutasi (inklusif).
      schema:
        type: string
        format: date
        example: "2026-07-31"

  requestBodies:
    AmountBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AmountRequest"
          examples:
            default:
              value:
                amount: "100000.00"
                note: Transaksi teller
    CustomerTransferBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerTransferRequest"
          examples:
            default:
              value:
                to_customer_id: ccustomer00000000000000002
                amount: "12500.00"
                note: Transfer via teller
    CustomerBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerUpsertRequest"
          examples:
            create:
              value:
                name: Customer Baru
                email: customerbaru@example.com
                password: password123
                status: active

  responses:
    ErrorResponse:
      description: Contoh response error standar. Status code aktual dapat berupa 400, 401, 403, 404, 409, 502, atau 500 sesuai kasus.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            error:
              value:
                status: false
                message: Request tidak valid
    CustomerListSuccessResponse:
      description: Customer berhasil diambil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerListSuccessResponse"
          examples:
            success:
              value:
                data:
                  items:
                    - id: ccustomer00000000000000001
                      name: Customer Satu
                      email: customer@example.com
                      account_number: "1000000001"
                      balance: 98750000
                      status: active
                      created_at: "2026-07-23 15:30:00"
                      updated_at: "2026-07-23 15:30:00"
                  pagination:
                    current_page: 1
                    per_page: 10
                    from: 1
                    total: 1
                    last_page: 1
                status: true
                message: Customer berhasil diambil
    AllMutationListSuccessResponse:
      description: Mutasi semua customer berhasil diambil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AllMutationListSuccessResponse"
          examples:
            success:
              value:
                data:
                  items:
                    - id: ctx000000000000000000001
                      customer_id: ccustomer00000000000000001
                      customer_name: Customer Satu
                      actor_name: Staff Teller
                      actor_role: staff
                      type: deposit
                      direction: in
                      amount: 10000000
                      balance_before: 90000000
                      balance_after: 100000000
                      reference_id: null
                      note: Setor tunai teller
                      created_at: "2026-07-23 15:30:00"
                  pagination:
                    current_page: 1
                    per_page: 10
                    from: 1
                    total: 1
                    last_page: 1
                status: true
                message: Mutasi semua customer berhasil diambil
    StaffDepositSuccessResponse:
      description: Setor tunai customer berhasil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationSuccessResponse"
          examples:
            success:
              value:
                data:
                  amount: 10000000
                  balance: 110000000
                status: true
                message: Setor tunai customer berhasil
    StaffWithdrawSuccessResponse:
      description: Tarik tunai customer berhasil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationSuccessResponse"
          examples:
            success:
              value:
                data:
                  amount: 5000000
                  balance: 105000000
                status: true
                message: Tarik tunai customer berhasil
    StaffTransferSuccessResponse:
      description: Transfer customer berhasil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperationSuccessResponse"
          examples:
            success:
              value:
                data:
                  transaction_id: ctx000000000000000000001
                  reference_id: cref000000000000000000001
                  amount: 1250000
                  balance: 98750000
                status: true
                message: Transfer customer berhasil
    CustomerSuccessResponse:
      description: Customer berhasil diproses
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerSuccessResponse"
    CustomerDetailSuccessResponse:
      description: Detail customer berhasil diambil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CustomerDetailSuccessResponse"
    MutationSuccessResponse:
      description: Detail mutasi berhasil diambil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MutationSuccessResponse"
    AllMutationSuccessResponse:
      description: Detail mutasi semua customer berhasil diambil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AllMutationSuccessResponse"
    DashboardSuccessResponse:
      description: Ringkasan dashboard berhasil diambil
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DashboardSuccessResponse"

  schemas:
    Role:
      type: string
      enum: [admin, staff, customer]
      example: customer
    TransactionType:
      type: string
      enum: [deposit, withdraw, transfer]
      example: transfer
    TransactionDirection:
      type: string
      enum: [in, out]
      example: out
    CustomerStatus:
      type: string
      enum: [active, inactive, blocked]
      example: active
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: Request tidak valid
    Pagination:
      type: object
      required: [current_page, per_page, from, total, last_page]
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        from:
          type: integer
          example: 1
        total:
          type: integer
          format: int64
          example: 25
        last_page:
          type: integer
          example: 3
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Customer Baru
        email:
          type: string
          format: email
          example: customerbaru@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          example: password123
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
    VerifyOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
    ResetPasswordRequest:
      type: object
      required: [email, reset_token, password, verify_password]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        reset_token:
          type: string
          example: reset-token-example
        password:
          type: string
          format: password
          minLength: 8
          example: passwordbaru123
        verify_password:
          type: string
          format: password
          minLength: 8
          example: passwordbaru123
    VerifyOtpData:
      type: object
      required: [email, reset_token]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        reset_token:
          type: string
          example: reset-token-example
    UpdateProfileRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Customer Update
        email:
          type: string
          format: email
          example: customer.update@example.com
    UpdatePasswordRequest:
      type: object
      required: [old_password, new_password, verify_password]
      properties:
        old_password:
          type: string
          format: password
          example: password123
        new_password:
          type: string
          format: password
          minLength: 8
          example: passwordbaru123
        verify_password:
          type: string
          format: password
          minLength: 8
          example: passwordbaru123
    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          description: Nominal dalam format desimal. Server menyimpan dan mengembalikan nominal sebagai integer cents.
          example: "100000.00"
        note:
          type: string
          nullable: true
          example: Setor tunai mandiri
    CustomerTransferRequest:
      type: object
      required: [to_customer_id, amount]
      properties:
        to_customer_id:
          type: string
          example: ccustomer00000000000000002
        amount:
          type: string
          description: Nominal dalam format desimal. Server menyimpan dan mengembalikan nominal sebagai integer cents.
          example: "12500.00"
        note:
          type: string
          nullable: true
          example: Transfer belanja
    CustomerUpsertRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Customer Baru
        email:
          type: string
          format: email
          example: customerbaru@example.com
        password:
          type: string
          format: password
          nullable: true
          description: Wajib saat create. Opsional saat update; jika kosong password tidak diubah.
          minLength: 8
          example: password123
        status:
          $ref: "#/components/schemas/CustomerStatus"
    StaffCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Staff Baru
        email:
          type: string
          format: email
          example: staffbaru@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123
    StaffUpdateRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Staff Teller Update
        email:
          type: string
          format: email
          example: staff.update@example.com
        password:
          type: string
          format: password
          nullable: true
          description: Opsional. Jika kosong, password tidak diubah.
          example: passwordbaru123
    UserData:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          example: ccustomer00000000000000001
        name:
          type: string
          example: Customer Satu
        email:
          type: string
          format: email
          example: customer@example.com
        role:
          $ref: "#/components/schemas/Role"
    RegisterData:
      allOf:
        - $ref: "#/components/schemas/UserData"
        - type: object
          required: [account_number]
          properties:
            account_number:
              type: string
              example: "1000000001"
    LoginData:
      type: object
      required: [access_token, user]
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
        user:
          $ref: "#/components/schemas/UserData"
    ForgotPasswordData:
      type: object
      nullable: true
      properties:
        otp_id:
          type: string
          example: cotp000000000000000000001
    OperationData:
      type: object
      required: [amount, balance]
      properties:
        transaction_id:
          type: string
          nullable: true
          description: ID transaksi utama yang dibuat oleh operasi.
          example: ctx000000000000000000001
        reference_id:
          type: string
          nullable: true
          example: cref000000000000000000001
        amount:
          type: integer
          format: int64
          description: Nominal dalam cents.
          example: 1250000
        balance:
          type: integer
          format: int64
          description: Saldo akhir dalam cents.
          example: 98750000
    CustomerItem:
      type: object
      required:
        [
          id,
          name,
          email,
          account_number,
          balance,
          status,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          example: ccustomer00000000000000001
        name:
          type: string
          example: Customer Satu
        email:
          type: string
          format: email
          example: customer@example.com
        account_number:
          type: string
          example: "1000000001"
        balance:
          type: integer
          format: int64
          example: 98750000
        status:
          $ref: "#/components/schemas/CustomerStatus"
        created_at:
          type: string
          example: "2026-07-23 15:30:00"
        updated_at:
