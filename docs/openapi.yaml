                data:
                  reference_id: cref000000000000000000001
                  amount: 1250000
                  balance: 98750000
                status: true
                message: Transfer customer berhasil

  schemas:
    Role:
      type: string
      enum: [admin, staff, customer]
      example: customer
    TransactionType:
      type: string
      enum: [deposit, withdraw, transfer]
      example: transfer
    TransactionDirection:
      type: string
      enum: [in, out]
      example: out
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: Request tidak valid
    Pagination:
      type: object
      required: [current_page, per_page, from, total, last_page]
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        from:
          type: integer
          example: 1
        total:
          type: integer
          format: int64
          example: 25
        last_page:
          type: integer
          example: 3
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Customer Baru
        email:
          type: string
          format: email
          example: customerbaru@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          example: password123
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
    VerifyOtpRequest:
      type: object
      required: [email, otp, password, verify_password]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
        password:
          type: string
          format: password
          minLength: 8
          example: passwordbaru123
        verify_password:
          type: string
          format: password
          minLength: 8
          example: passwordbaru123
    UpdateProfileRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Customer Update
        email:
          type: string
          format: email
          example: customer.update@example.com
    UpdatePasswordRequest:
      type: object
      required: [old_password, new_password, verify_password]
      properties:
        old_password:
          type: string
          format: password
          example: password123
        new_password:
          type: string
          format: password
          minLength: 8
          example: passwordbaru123
        verify_password:
          type: string
          format: password
          minLength: 8
          example: passwordbaru123
    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          description: Nominal dalam format desimal. Server menyimpan dan mengembalikan nominal sebagai integer cents.
          example: "100000.00"
        note:
          type: string
          nullable: true
          example: Setor tunai mandiri
    CustomerTransferRequest:
      type: object
      required: [to_customer_id, amount]
      properties:
        to_customer_id:
          type: string
          example: ccustomer00000000000000002
        amount:
          type: string
          description: Nominal dalam format desimal. Server menyimpan dan mengembalikan nominal sebagai integer cents.
          example: "12500.00"
        note:
          type: string
          nullable: true
          example: Transfer belanja
    StaffCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Staff Baru
        email:
          type: string
          format: email
          example: staffbaru@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123
    StaffUpdateRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          example: Staff Teller Update
        email:
          type: string
          format: email
          example: staff.update@example.com
        password:
          type: string
          format: password
          nullable: true
          description: Opsional. Jika kosong, password tidak diubah.
          example: passwordbaru123
    UserData:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          example: ccustomer00000000000000001
        name:
          type: string
          example: Customer Satu
        email:
          type: string
          format: email
          example: customer@example.com
        role:
          $ref: "#/components/schemas/Role"
    RegisterData:
      allOf:
        - $ref: "#/components/schemas/UserData"
