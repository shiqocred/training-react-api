          format: int64
          description: Nominal dalam cents.
          example: 1250000
        balance:
          type: integer
          format: int64
          description: Saldo akhir dalam cents.
          example: 98750000
    CustomerItem:
      type: object
      required: [id, name, email, account_number, balance, created_at]
      properties:
        id:
          type: string
          example: ccustomer00000000000000001
        name:
          type: string
          example: Customer Satu
        email:
          type: string
          format: email
          example: customer@example.com
        account_number:
          type: string
          example: "1000000001"
        balance:
          type: integer
          format: int64
          example: 98750000
        created_at:
          type: string
          example: "2026-07-23 15:30:00"
    StaffItem:
